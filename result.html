<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chick-check — link report</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="sheet-body">
  <main class="sheet" id="sheet">
    <div class="sheet__brand">
      <img src="icons/logo.png" alt="chick-check" />
    </div>

    <h1 class="sheet__title" id="title">Link report</h1>
    <p class="sheet__lead" id="lead"></p>

    <div class="sheet__url">
      <span class="sheet__url-label">Link</span>
      <code id="target-url"></code>
    </div>

    <div class="meter" id="meter">
      <div class="meter__track"><div class="meter__fill" id="meter-fill"></div></div>
      <div class="meter__caption"><span id="meter-score">0</span>/100 risk score</div>
    </div>

    <ul class="sheet__reasons" id="reasons"></ul>

    <p class="sheet__footer">
      <span id="version"></span>
      <a id="fp-link" href="#" target="_blank" rel="noopener">Report a false positive</a>
      <a href="options.html">Settings</a>
    </p>
  </main>

  <script type="module" src="result.js"></script>
</body>
</html>
