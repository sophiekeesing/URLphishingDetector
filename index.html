<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shield — Phishing Link Checker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="popup">
    <header class="popup__header">
      <span class="popup__logo">🛡️</span>
      <div>
        <h1 class="popup__title">URL Shield</h1>
        <p class="popup__subtitle">Is this page safe to use?</p>
      </div>
    </header>

    <section class="checker">
      <label for="url-input" class="visually-hidden">URL to check</label>
      <input
        id="url-input"
        type="text"
        placeholder="e.g. https://example.com"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="check-btn" type="button">Check</button>
    </section>

    <!-- Only shown when running as an installed extension popup -->
    <button id="use-tab-btn" class="use-tab-btn" type="button" hidden>
      📍 Re-check this tab
    </button>

    <!-- Result panel: hidden until the first check runs -->
    <section id="result-panel" class="result" hidden>
      <div class="result__badge">
        <span id="result-icon">•</span>
        <span id="result-label">—</span>
      </div>
      <p class="result__message" id="result-message"></p>
      <ul class="result__reasons" id="result-reasons"></ul>
      <ul class="result__sources" id="result-sources" hidden></ul>
    </section>

    <section class="examples">
      <p class="examples__title">Try an example:</p>
      <div class="examples__chips" id="example-chips"></div>
    </section>

    <footer class="popup__footer">
      <a id="options-link" href="#" hidden>Add a Google Safe Browsing API key →</a>
      <span id="mode-note" hidden></span>
    </footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
